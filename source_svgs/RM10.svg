<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Asphalt Base -->
  <rect width="200" height="200" fill="#606063" />

  <!-- Right Verge & Curb -->
  <rect x="180" y="0" width="20" height="200" fill="#00A651" />
  <rect x="166" y="0" width="14" height="200" fill="#000000" />

  <!-- Left Green Verges -->
  <path d="M 0,0 L 75,0 C 75,35 50,50 0,50 Z" fill="#00A651" />
  <path d="M 0,200 L 85,200 C 85,150 50,150 0,150 Z" fill="#00A651" />

  <!-- T-Junction Approach -->
  <rect x="0" y="50" width="30" height="100" fill="#606063" />

  <!-- Stop Line -->
  <line x1="50" y1="50" x2="50" y2="100" stroke="#FFFFFF" stroke-width="5" />
  <line x1="0" y1="100" x2="50" y2="100" stroke="#FFFFFF" stroke-width="4" />

  <!-- Dividers -->
  <rect x="115" y="10" width="8" height="35" fill="#FFFFFF" />
  <rect x="115" y="155" width="8" height="35" fill="#FFFFFF" />

  <!-- Arrows -->
  <polygon points="135,20 148,40 122,40" fill="#1A1A1A" />
  <polygon points="90,180 77,160 103,160" fill="#1A1A1A" />

  <!-- RM10 Yellow Box Junction -->
  <g stroke="#FFF100" stroke-width="3" stroke-linecap="square" fill="none">
    <rect x="60" y="52" width="42" height="96" />
    <line x1="60" y1="84" x2="102" y2="84" />
    <line x1="60" y1="116" x2="102" y2="116" />
    <line x1="60" y1="52" x2="102" y2="84" />
    <line x1="102" y1="52" x2="60" y2="84" />
    <line x1="60" y1="84" x2="102" y2="116" />
    <line x1="102" y1="84" x2="60" y2="116" />
    <line x1="60" y1="116" x2="102" y2="148" />
    <line x1="102" y1="116" x2="60" y2="148" />
  </g>
</svg>
